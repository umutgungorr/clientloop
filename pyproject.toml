[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clientloop"
version = "0.1.0"
description = "⚡ Zero-dependency routine, task & billable deliverable tracker for freelance & indie developers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["freelance", "tasks", "routine", "billing", "deliverables", "cli", "sqlite", "productivity"]
authors = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Office/Business",
]
dependencies = []

[project.scripts]
clientloop = "clientloop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clientloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
